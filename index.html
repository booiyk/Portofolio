<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adrian Fikri Fahrezi</title>
<meta name="description" content="Portofolio Adrian Fikri Fahrezi">
<meta name="theme-color" content="#000000">
<style>
  :root { --bg:#000; --fg:#fff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg); }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px; letter-spacing: .02em;
    height:100dvh;
  }
  a, button { color:inherit; font:inherit; letter-spacing:inherit; background:none; border:0; cursor:pointer; text-decoration:none; }
  a:focus-visible, button:focus-visible { outline:1px solid var(--fg); outline-offset:4px; }

  header {
    position:fixed; top:0; left:0; right:0; z-index:20; mix-blend-mode:difference;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:calc(18px + env(safe-area-inset-top)) 20px 18px;
  }
  .name { justify-self:start; }
  .project { justify-self:center; }
  .info { justify-self:end; animation: blink 1.2s steps(1,end) infinite; }
  .info[aria-expanded="true"], .info:hover { animation:none; }
  @keyframes blink { 0%,60% {opacity:1} 61%,100% {opacity:.15} }

  main { position:fixed; inset:0; }
  video { width:100%; height:100%; object-fit:cover; display:block; background:#000; }

  footer { position:fixed; left:0; right:0; bottom:0; z-index:20; mix-blend-mode:difference; padding:18px 20px calc(18px + env(safe-area-inset-bottom)); text-align:center; }

  .panel {
    position:fixed; inset:0; z-index:10; background:var(--bg);
    display:none; padding: calc(env(safe-area-inset-top) + 64px) 20px calc(env(safe-area-inset-bottom) + 64px);
    overflow:auto;
  }
  .panel.open { display:flex; }
  .panel .inner {
    margin:auto; width:100%; max-width:520px;
    text-align:center; font-weight:700; font-size:16px; line-height:1.6;
  }
  .row + .row { margin-top:14px; }
  .row .d { margin-right:.7em; }
  .panel a { border-bottom:1px solid var(--fg); }
  .info-text { white-space:pre-line; }

  @media (prefers-reduced-motion: reduce) { .info { animation:none; } }
</style>
</head>
<body>

<header>
  <a class="name" href="#" data-close>Adrian Fikri Fahrezi</a>
  <button class="project" data-open="project" aria-expanded="false">Project</button>
  <button class="info" data-open="info" aria-expanded="false">Info</button>
</header>

<main>
  <video src="video.mp4" autoplay muted loop playsinline preload="auto"></video>
</main>

<footer>
  <button data-open="contact" aria-expanded="false">Contact</button>
</footer>

<section class="panel" id="project" aria-label="Project"><div class="inner"></div></section>
<section class="panel" id="info" aria-label="Info"><div class="inner info-text"></div></section>
<section class="panel" id="contact" aria-label="Contact"><div class="inner"></div></section>

<script>
  /* ---------- Konten ---------- */
  const DEFAULT = {
    name: "Adrian Fikri Fahrezi",
    projects: [
      { date: "2026-11-26", title: "Nama project 1", url: "" },
      { date: "2026-10-12", title: "Nama project 2", url: "" }
    ],
    info: "Tulis deskripsi singkat tentang dirimu di sini.",
    contacts: [
      { label: "emailkamu@gmail.com", url: "mailto:emailkamu@gmail.com" },
      { label: "Instagram", url: "https://instagram.com/usernamekamu" },
      { label: "WhatsApp", url: "https://wa.me/628123456789" }
    ]
  };
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function formatDate(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return '';
    return m[3] + (MONTHS[parseInt(m[2], 10) - 1] || '');
  }
  function safeUrl(u) {
    u = (u || '').trim();
    if (!u) return '';
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
    if (/^[^\s@]+@[^\s@]+$/.test(u)) return 'mailto:' + u;
    if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';
    return 'https://' + u;
  }
  function makeLink(text, url) {
    const a = document.createElement('a');
    a.href = url; a.textContent = text;
    if (/^https?:/i.test(url)) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }
  function render(c) {
    const name = c.name || DEFAULT.name;
    document.querySelector('.name').textContent = name;
    document.title = name;

    const pl = document.querySelector('#project .inner');
    pl.textContent = '';
    [...(c.projects || [])]
      .sort((a, b) => String(b.date).localeCompare(String(a.date)))
      .forEach(p => {
        const row = document.createElement('div');
        row.className = 'row';
        const d = formatDate(p.date);
        if (d) { const s = document.createElement('span'); s.className = 'd'; s.textContent = d; row.appendChild(s); }
        const url = safeUrl(p.url);
        if (url) row.appendChild(makeLink(p.title || '', url));
        else row.appendChild(document.createTextNode(p.title || ''));
        pl.appendChild(row);
      });

    document.querySelector('#info .inner').textContent = c.info || '';

    const cl = document.querySelector('#contact .inner');
    cl.textContent = '';
    (c.contacts || []).forEach(k => {
      const row = document.createElement('div');
      row.className = 'row';
      const url = safeUrl(k.url);
      if (url) row.appendChild(makeLink(k.label || '', url));
      else row.appendChild(document.createTextNode(k.label || ''));
      cl.appendChild(row);
    });
  }

  fetch('content.json', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .catch(() => DEFAULT)
    .then(render);

  /* ---------- Panel ---------- */
  const panels = document.querySelectorAll('.panel');
  const triggers = document.querySelectorAll('[data-open]');
  function closeAll() {
    panels.forEach(p => p.classList.remove('open'));
    triggers.forEach(t => t.setAttribute('aria-expanded', 'false'));
  }
  triggers.forEach(t => t.addEventListener('click', () => {
    const target = document.getElementById(t.dataset.open);
    const wasOpen = target.classList.contains('open');
    closeAll();
    if (!wasOpen) { target.classList.add('open'); t.setAttribute('aria-expanded', 'true'); }
  }));
  document.querySelector('[data-close]').addEventListener('click', e => { e.preventDefault(); closeAll(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
</script>
</body>
</html>
