<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memuat…</title>
<meta name="description" content="">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --bg:#000; --fg:#fff; --muted:#888; --line:#222; --line-strong:#333;
    --accent:#fff; --card:#0a0a0a; --radius:0;
    --max:1080px; --pad:24px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--fg);
    font:16px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration:none; }
  img { display:block; max-width:100%; height:auto; }
  .wrap { max-width:var(--max); margin:0 auto; padding:0 var(--pad); }
  .muted { color:var(--muted); }
  .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  h1,h2,h3 { font-weight:700; line-height:1.2; letter-spacing:-.01em; }
  h1 { font-size:clamp(28px,5vw,52px); }
  h2 { font-size:clamp(22px,3.4vw,34px); margin-bottom:6px; }
  h3 { font-size:18px; }
  section { padding:64px 0; border-top:1px solid var(--line); }
  section:first-of-type { border-top:0; }
  .section-head { margin-bottom:32px; max-width:640px; }

  /* Buttons */
  .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 20px;
    border:1px solid var(--fg); font-weight:700; font-size:14px; cursor:pointer;
    transition:opacity .15s, transform .15s; }
  .btn:hover { opacity:.85; }
  .btn.primary { background:var(--fg); color:var(--bg); }
  .btn.ghost { background:transparent; color:var(--fg); }

  /* Header */
  header.site { position:sticky; top:0; z-index:20; background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  header.site .wrap { display:flex; align-items:center; justify-content:space-between;
    gap:16px; height:60px; }
  .brand { font-weight:700; font-size:15px; letter-spacing:-.01em; }
  nav.top { display:flex; gap:20px; }
  nav.top a { font-size:13px; color:var(--muted); }
  nav.top a:hover { color:var(--fg); }
  @media (max-width:640px) { nav.top { display:none; } }

  /* Hero */
  .hero { padding:96px 0 80px; border-top:0; }
  .hero .sub { font-size:clamp(15px,1.6vw,18px); color:var(--muted); max-width:640px; margin-top:18px; }
  .hero .cta { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:56px;
    padding-top:28px; border-top:1px solid var(--line); }
  .stat .v { font-size:clamp(22px,3vw,32px); font-weight:700; }
  .stat .l { font-size:13px; color:var(--muted); margin-top:2px; }
  @media (max-width:640px) { .stats { grid-template-columns:1fr 1fr 1fr; gap:12px; } }

  /* Services */
  .grid-svc { display:grid; grid-template-columns:repeat(2,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); }
  .svc { background:var(--bg); padding:28px; display:flex; flex-direction:column; gap:12px; }
  .svc .price { font-weight:700; font-size:15px; }
  .svc p { color:var(--muted); font-size:14px; }
  .svc ul { list-style:none; display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .svc li { font-size:12px; color:var(--muted); border:1px solid var(--line-strong);
    padding:3px 8px; }
  @media (max-width:760px) { .grid-svc { grid-template-columns:1fr; } }

  /* Packages */
  .grid-pkg { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .pkg { border:1px solid var(--line-strong); padding:28px; display:flex; flex-direction:column; gap:16px; position:relative; }
  .pkg.hl { border-color:var(--fg); }
  .pkg.hl::before { content:"Paling populer"; position:absolute; top:-1px; right:-1px;
    background:var(--fg); color:var(--bg); font-size:11px; font-weight:700;
    padding:4px 10px; letter-spacing:.04em; }
  .pkg .name { font-size:14px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .pkg .price { font-size:24px; font-weight:700; }
  .pkg ul { list-style:none; display:grid; gap:8px; margin-top:4px; }
  .pkg li { font-size:14px; color:var(--muted); padding-left:18px; position:relative; }
  .pkg li::before { content:"—"; position:absolute; left:0; color:var(--fg); }
  @media (max-width:860px) { .grid-pkg { grid-template-columns:1fr; } }

  /* Portfolio */
  .grid-port { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .port { border:1px solid var(--line-strong); overflow:hidden; display:flex; flex-direction:column; }
  .port .thumb { aspect-ratio:16/10; background:#111; overflow:hidden; }
  .port .thumb img { width:100%; height:100%; object-fit:cover; transition:transform .4s; }
  .port:hover .thumb img { transform:scale(1.04); }
  .port .body { padding:16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .port .meta { font-size:12px; color:var(--muted); }
  .port .desc { font-size:13px; color:var(--muted); }
  .port .visit { font-size:13px; font-weight:700; margin-top:auto; padding-top:8px; }
  @media (max-width:860px) { .grid-port { grid-template-columns:1fr 1fr; } }
  @media (max-width:560px) { .grid-port { grid-template-columns:1fr; } }

  /* Process */
  .process { display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); }
  .step { background:var(--bg); padding:24px 20px; }
  .step .n { font-size:12px; color:var(--muted); letter-spacing:.1em; }
  .step h3 { font-size:15px; margin:8px 0 6px; }
  .step p { font-size:13px; color:var(--muted); }
  @media (max-width:900px) { .process { grid-template-columns:1fr 1fr; } }
  @media (max-width:520px) { .process { grid-template-columns:1fr; } }

  /* Testimonials */
  .grid-test { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .test { border:1px solid var(--line-strong); padding:24px; display:flex; flex-direction:column; gap:14px; }
  .test .stars { color:var(--fg); font-size:14px; letter-spacing:2px; }
  .test .text { font-size:14px; color:#ccc; flex:1; }
  .test .who { font-size:13px; }
  .test .who .name { font-weight:700; }
  .test .who .role { color:var(--muted); }
  @media (max-width:860px) { .grid-test { grid-template-columns:1fr; } }

  /* FAQ */
  .faq { max-width:760px; }
  .faq details { border-top:1px solid var(--line); padding:18px 0; }
  .faq details:last-child { border-bottom:1px solid var(--line); }
  .faq summary { cursor:pointer; font-weight:700; font-size:15px; list-style:none;
    display:flex; justify-content:space-between; gap:16px; }
  .faq summary::-webkit-details-marker { display:none; }
  .faq summary::after { content:"+"; color:var(--muted); font-weight:400; }
  .faq details[open] summary::after { content:"–"; }
  .faq .a { color:var(--muted); font-size:14px; margin-top:10px; max-width:640px; }

  /* CTA */
  .cta-block { border:1px solid var(--line-strong); padding:56px 32px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:16px; }
  .cta-block h2 { max-width:640px; }
  .cta-block p { color:var(--muted); max-width:520px; }

  /* Footer */
  footer.site { border-top:1px solid var(--line); padding:40px 0 32px; }
  footer.site .wrap { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-start; }
  .footer-links { display:flex; flex-wrap:wrap; gap:16px; }
  .footer-links a { font-size:14px; color:var(--muted); }
  .footer-links a:hover { color:var(--fg); }
  .footer-note { font-size:12px; color:var(--muted); width:100%; padding-top:24px;
    margin-top:8px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap;
    justify-content:space-between; gap:8px; }

  .loading { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .loading .dot { width:8px; height:8px; border-radius:50%; background:#fff;
    animation:pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:1} }

  .reveal { opacity:0; transform:translateY(8px); transition:opacity .6s, transform .6s; }
  .reveal.in { opacity:1; transform:none; }
  @media (prefers-reduced-motion:reduce) { .reveal { opacity:1; transform:none; transition:none; } html { scroll-behavior:auto; } }
</style>
</head>
<body>

<div class="loading" id="loading"><div class="dot"></div></div>

<header class="site" id="siteHeader" style="display:none">
  <div class="wrap">
    <a class="brand" id="brandLink" href="#top"></a>
    <nav class="top" id="nav"></nav>
  </div>
</header>

<main id="app" style="display:none"></main>

<script>
  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const stars = n => '★'.repeat(Math.max(0, Math.min(5, +n || 0))) + '☆'.repeat(5 - Math.max(0, Math.min(5, +n || 0)));

  function safeUrl(u) {
    if (!u) return '#';
    const s = String(u).trim();
    if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
    if (s.startsWith('#') || s.startsWith('/')) return s;
    return '#';
  }

  async function boot() {
    let data;
    try {
      const res = await fetch('content.json?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      data = await res.json();
    } catch (e) {
      $('#loading').innerHTML = '<p style="color:#888;font-size:14px">Gagal memuat konten. ' + esc(e.message) + '</p>';
      return;
    }
    render(data);
    $('#loading').style.display = 'none';
    $('#siteHeader').style.display = '';
    $('#app').style.display = '';
  }

  function render(d) {
    document.title = (d.meta && d.meta.title) || d.brand || 'Jasa Freelance';
    const md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', (d.meta && d.meta.description) || d.tagline || '');
    const mt = document.querySelector('meta[name="theme-color"]');
    if (mt) mt.setAttribute('content', (d.meta && d.meta.themeColor) || '#000000');
    if (d.meta && d.meta.lang) document.documentElement.lang = d.meta.lang;

    // Header
    $('#brandLink').textContent = d.brand || '';
    const sections = [
      ['#services', 'Layanan'],
      ['#packages', 'Paket'],
      ['#portfolio', 'Portofolio'],
      ['#process', 'Proses'],
      ['#faq', 'FAQ']
    ];
    $('#nav').innerHTML = sections.map(([h, t]) => `<a href="${h}">${esc(t)}</a>`).join('');

    const parts = [];

    // Hero
    const h = d.hero || {};
    parts.push(`
      <section class="hero" id="top">
        <div class="wrap">
          <p class="eyebrow reveal">${esc(d.tagline || '')}</p>
          <h1 class="reveal" style="margin-top:12px">${esc(h.headline || d.brand || '')}</h1>
          ${h.subheadline ? `<p class="sub reveal">${esc(h.subheadline)}</p>` : ''}
          <div class="cta reveal">
            ${h.primaryCta ? `<a class="btn primary" href="${esc(safeUrl(h.primaryCta.url))}" target="_blank" rel="noopener">${esc(h.primaryCta.label || 'Hubungi')}</a>` : ''}
            ${h.secondaryCta ? `<a class="btn ghost" href="${esc(safeUrl(h.secondaryCta.url))}">${esc(h.secondaryCta.label || 'Selengkapnya')}</a>` : ''}
          </div>
          ${Array.isArray(d.stats) && d.stats.length ? `
            <div class="stats reveal">
              ${d.stats.map(s => `<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div>`).join('')}
            </div>` : ''}
        </div>
      </section>`);

    // About
    if (d.about) {
      parts.push(`
        <section id="about">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Tentang</p>
              <h2 class="reveal">${esc(d.brand || '')}</h2>
            </div>
            <p class="reveal" style="max-width:720px;color:#ccc;font-size:16px">${esc(d.about)}</p>
          </div>
        </section>`);
    }

    // Services
    if (Array.isArray(d.services) && d.services.length) {
      parts.push(`
        <section id="services">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Layanan</p>
              <h2 class="reveal">Apa yang bisa kami bantu</h2>
            </div>
            <div class="grid-svc reveal">
              ${d.services.map(s => `
                <div class="svc">
                  <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
                    <h3>${esc(s.title)}</h3>
                    ${s.price ? `<span class="price">${esc(s.price)}</span>` : ''}
                  </div>
                  ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
                  ${Array.isArray(s.features) && s.features.length ? `<ul>${s.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
                </div>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // Packages
    if (Array.isArray(d.packages) && d.packages.length) {
      parts.push(`
        <section id="packages">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Paket Harga</p>
              <h2 class="reveal">Pilih yang sesuai kebutuhan</h2>
            </div>
            <div class="grid-pkg reveal">
              ${d.packages.map(p => `
                <div class="pkg ${p.highlight ? 'hl' : ''}">
                  <div class="name">${esc(p.name)}</div>
                  <div class="price">${esc(p.price)}</div>
                  <ul>${(p.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
                  ${d.cta && d.cta.url ? `<a class="btn ${p.highlight ? 'primary' : 'ghost'}" style="margin-top:auto" href="${esc(safeUrl(d.cta.url))}" target="_blank" rel="noopener">${esc(d.cta.button || 'Pesan')}</a>` : ''}
                </div>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // Portfolio
    if (Array.isArray(d.portfolio) && d.portfolio.length) {
      parts.push(`
        <section id="portfolio">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Portofolio</p>
              <h2 class="reveal">Sebagian project yang sudah dikerjakan</h2>
            </div>
            <div class="grid-port reveal">
              ${d.portfolio.map(p => `
                <a class="port" href="${esc(safeUrl(p.url))}" ${p.url ? 'target="_blank" rel="noopener"' : ''}>
                  <div class="thumb">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy">` : ''}</div>
                  <div class="body">
                    <div class="meta">${esc([p.client, p.year].filter(Boolean).join(' · '))}</div>
                    <h3>${esc(p.title)}</h3>
                    ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ''}
                    ${p.url ? `<div class="visit">Kunjungi →</div>` : ''}
                  </div>
                </a>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // Process
    if (Array.isArray(d.process) && d.process.length) {
      parts.push(`
        <section id="process">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Proses</p>
              <h2 class="reveal">Cara kerja kami</h2>
            </div>
            <div class="process reveal">
              ${d.process.map(s => `
                <div class="step">
                  <div class="n">${esc(s.step || '')}</div>
                  <h3>${esc(s.title || '')}</h3>
                  ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
                </div>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // Testimonials
    if (Array.isArray(d.testimonials) && d.testimonials.length) {
      parts.push(`
        <section id="testimonials">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">Testimoni</p>
              <h2 class="reveal">Kata klien</h2>
            </div>
            <div class="grid-test reveal">
              ${d.testimonials.map(t => `
                <div class="test">
                  <div class="stars">${stars(t.rating)}</div>
                  <div class="text">"${esc(t.text)}"</div>
                  <div class="who"><div class="name">${esc(t.name)}</div><div class="role">${esc(t.role || '')}</div></div>
                </div>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // FAQ
    if (Array.isArray(d.faq) && d.faq.length) {
      parts.push(`
        <section id="faq">
          <div class="wrap">
            <div class="section-head">
              <p class="eyebrow reveal">FAQ</p>
              <h2 class="reveal">Pertanyaan yang sering diajukan</h2>
            </div>
            <div class="faq reveal">
              ${d.faq.map((f, i) => `
                <details ${i === 0 ? 'open' : ''}>
                  <summary>${esc(f.q)}</summary>
                  <div class="a">${esc(f.a)}</div>
                </details>`).join('')}
            </div>
          </div>
        </section>`);
    }

    // CTA
    if (d.cta && d.cta.text) {
      parts.push(`
        <section id="contact">
          <div class="wrap">
            <div class="cta-block reveal">
              <h2>${esc(d.cta.text)}</h2>
              ${d.cta.subtext ? `<p>${esc(d.cta.subtext)}</p>` : ''}
              ${d.cta.url ? `<a class="btn primary" href="${esc(safeUrl(d.cta.url))}" target="_blank" rel="noopener">${esc(d.cta.button || 'Hubungi')}</a>` : ''}
            </div>
          </div>
        </section>`);
    }

    $('#app').innerHTML = parts.join('');

    // Footer
    const footer = document.createElement('footer');
    footer.className = 'site';
    const links = (d.contacts || []).map(c => `<a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join('');
    footer.innerHTML = `
      <div class="wrap">
        <div>
          <div class="brand">${esc(d.brand || '')}</div>
          <div class="muted" style="font-size:13px;margin-top:4px">${esc(d.tagline || '')}</div>
        </div>
        <div class="footer-links">${links}</div>
        <div class="footer-note">
          <span>${esc((d.footer && d.footer.copyright) || '')}</span>
          <span>${esc((d.footer && d.footer.note) || '')}</span>
        </div>
      </div>`;
    document.body.appendChild(footer);

    // Reveal on scroll
    const io = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 }) : null;
    document.querySelectorAll('.reveal').forEach(el => {
      if (io) io.observe(el); else el.classList.add('in');
    });
  }

  boot();
</script>
</body>
</html>
